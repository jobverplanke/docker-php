name: Build

on:
  push:
    branches:
      - main
    paths:
      - '8.5/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Least privilege: the default token can only read the repo; the jobs that
# publish additionally get packages:write below. No PAT needed.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/php

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        type: ['fpm', 'cli']
        env: ['production', 'dev']
        platform: ['linux/amd64', 'linux/arm64']
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    name: Build PHP ${{ matrix.php }}-${{ matrix.type }}-${{ matrix.env }} Alpine (${{ matrix.arch }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.php }}
          file: ./${{ matrix.php }}/${{ matrix.type }}/Dockerfile
          target: ${{ matrix.env }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: scan-target:${{ matrix.php }}-${{ matrix.type }}-${{ matrix.env }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.type }}-${{ matrix.env }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.type }}-${{ matrix.env }}-${{ matrix.arch }}

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target:${{ matrix.php }}-${{ matrix.type }}-${{ matrix.env }}-${{ matrix.arch }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # Pushed without a tag: the tag is applied once, in the merge job, after
      # every platform of this variant has passed the gate. Re-running the
      # build here is a cache hit on the step above.
      #
      # provenance/sbom make each push an index (image manifest + attestation
      # manifests) rather than a bare manifest; imagetools create in the merge
      # job flattens those indexes into one and carries the attestations over,
      # so the published tag keeps mode=max provenance and an SBOM per arch.
      - name: Push by digest with provenance and SBOM
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.php }}
          file: ./${{ matrix.php }}/${{ matrix.type }}/Dockerfile
          target: ${{ matrix.env }}
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.type }}-${{ matrix.env }}-${{ matrix.arch }}

      # Hand the digest to the merge job as an empty file named after it.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.php }}-${{ matrix.type }}-${{ matrix.env }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One job per variant (not per architecture): collects that variant's
  # per-platform digests and publishes them under a single tag.
  merge:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        type: ['fpm', 'cli']
        env: ['production', 'dev']

    env:
      TAG: ${{ matrix.php }}-${{ matrix.type }}${{ matrix.env == 'dev' && '-dev' || '' }}

    name: Publish PHP ${{ matrix.php }}-${{ matrix.type }}-${{ matrix.env }} Alpine (multi-arch)

    steps:
      # Only this variant's digests; the pattern excludes the other variants.
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.php }}-${{ matrix.type }}-${{ matrix.env }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest index and push tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Each downloaded file is named after one platform's digest. The
          # word splitting on the printf is deliberate: every digest has to
          # reach imagetools as its own argument.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            --tag "${REGISTRY_IMAGE}:${TAG}" \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Inspect published image
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${TAG}"

  cleanup:
    needs: [merge]
    runs-on: ubuntu-24.04
    permissions:
      packages: write

    name: Remove untagged package versions

    steps:
      - name: Delete untagged versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: php
          delete-untagged: true
          # Warns when a tagged multi-arch index misses a platform manifest
          # after the cleanup, as a check that nothing referenced was removed.
          validate: true
          # Only logs what would be deleted. Set to false once a run's log
          # shows the expected set.
          dry-run: true
